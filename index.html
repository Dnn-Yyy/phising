<!DOCTYPE html>
<html>
<head>
    <title>Test Bot</title>
</head>
<body>
    <h1>Test Bot Telegram</h1>
    <button onclick="testBot()">Klik untuk Test Bot</button>
    
    <script>
    const BOT_TOKEN = '8608790259:AAEJE3df1Tr9qC0uQ48r_q_wDThPSzQGFG0';
    const CHAT_ID = '7868298450';
    
    async function testBot() {
        try {
            console.log('Mencoba mengirim pesan...');
            
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: 'Test pesan dari browser!',
                    parse_mode: 'HTML'
                })
            });
            
            const result = await response.json();
            console.log('Response:', result);
            
            if (result.ok) {
                alert('Berhasil! Cek Telegram Anda');
            } else {
                alert('Gagal: ' + result.description);
            }
            
        } catch (error) {
            console.error('Error:', error);
            alert('Error: ' + error.message);
        }
    }
    </script>
</body>
</html>
